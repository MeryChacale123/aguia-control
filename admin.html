<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ÁGUIA CONTROL - Centro de Comando</title>
    <link rel="stylesheet" href="admin-premium.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-platina">

    <div class="dashboard-wrapper">
        <aside class="sidebar-comando">
            <div class="brand">
                <img src="img/logo-aguia.png" alt="Logo">
                <h1>ÁGUIA <span>CONTROL</span></h1>
            </div>

            <nav class="nav-admin">
                <a href="#" class="active"><i class="fas fa-home"></i> Dashboard</a>
                <a href="#"><i class="fas fa-users"></i> Gestão de Membros</a>
                <a href="#"><i class="fas fa-images"></i> Editar Galeria</a>
                <a href="#"><i class="fas fa-newspaper"></i> Editar Notícias</a>
                <a href="#"><i class="fas fa-calendar-alt"></i> Reuniões & Ensaios</a>
            </nav>

            <div class="sidebar-footer">
                <a href="index.html" class="btn-sair"><i class="fas fa-power-off"></i> Terminar Sessão</a>
            </div>
        </aside>

        <main class="main-painel">
            <header class="header-status">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Pesquisar no comando...">
                </div>

                <div class="admin-profile">
                    <div class="notificacoes"><i class="fas fa-bell"></i><span class="badge">3</span></div>
                    <img src="img/diretor.jpg" alt="Admin" class="avatar">
                    <div class="menu-extra">
                        <button class="btn-dots" onclick="toggleMenu()"><i class="fas fa-ellipsis-v"></i></button>
                        <div id="drop-admin" class="drop-content">
                            <a href="#"><i class="fas fa-user-cog"></i> Perfil Admin</a>
                            <a href="#"><i class="fas fa-moon"></i> Modo Escuro</a>
                            <a href="#"><i class="fas fa-shield-alt"></i> Segurança</a>
                        </div>
                    </div>
                </div>
            </header>

            <section class="secao-ativa">
                <div class="titulo-pagina">
                    <h2>Aguardando Aprovação</h2>
                    <p>Membros recém-cadastrados que aguardam autorização de acesso.</p>
                </div>

                <div class="card-lista">
                    <div class="membro-row">
                        <div class="membro-info">
                            <img src="img/membro-placeholder.png" alt="">
                            <div>
                                <strong>Joaquim Alberto</strong>
                                <span>Pendente • Unidade Falcões</span>
                            </div>
                        </div>
                        <div class="acoes-grupo">
                            <button class="btn-acao aceitar"><i class="fas fa-check"></i> ACEITAR</button>
                            <button class="btn-acao recusar"><i class="fas fa-times"></i> REMOVER</button>
                            <button class="btn-acao ver-perfil"><i class="fas fa-eye"></i> PERFIL</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
