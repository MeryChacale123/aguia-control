<div class="admin-card">
    <div class="header-gestao">
        <h2><i class="fas fa-users-cog"></i> Gestão de Membros do Clube</h2>
        
        <div class="filtros-unidade">
            <select id="filtro-genero" onchange="filtrarUnidades()">
                <option value="todos">Todas as Unidades</option>
                <optgroup label="Unidades Masculinas">
                    <option value="Águia Portadora">Águia Portadora</option>
                    <option value="Águia Reluzente">Águia Reluzente</option>
                    <option value="Águia Salvadora">Águia Salvadora</option>
                       <option value="Águia De Luz">Águia Salvadora</option>
                </optgroup>
                <optgroup label="Unidades Femininas">
                    <option value="Águia Veloz">Águia Veloz</option>
                    <option value="Águia Divina">Águia Divina</option>
                    <option value="Águia Pesqueira e Peregrina">Águia Pesqueira e Peregrina</option>
                     <option value="Águia Da Paz">Águia Da Paz</option>
                      <option value="Águia Do Esplendor">Águia Do Esplendor</option>
                       <option value="Águia Prateada">Águia Prateada</option>
                </optgroup>
            </select>
        </div>
    </div>

    <table class="tabela-membros">
        <thead>
            <tr>
                <th>Membro</th>
                <th>Unidade</th>
                <th>Classe / Progresso</th>
                <th>Saúde & Autorização</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="lista-membros-firebase">
            </tbody>
    </table>
</div>

<style>
    /* Estilo para facilitar a leitura rápida de saúde no painel */
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .status-alerta { background: #e74c3c; color: white; } /* Alergias/Saúde */
    .status-ok { background: #2ecc71; color: white; }    /* Autorização Pais */
    
    .progresso-mini { width: 100px; height: 6px; background: #333; border-radius: 3px; display: inline-block; }
    .progresso-fill { height: 100%; background: #b8860b; border-radius: 3px; }
div class="controles-gestao">
    <label for="filtro-unidade-gestao">Selecione a Unidade para Inspeção:</label>
    <select id="filtro-unidade-gestao">
        <option value="todas">Todas as Unidades</option>
        <optgroup label="Ala Feminina">
            <option value="aguia-veloz">Águia Veloz</option>
            <option value="aguia-divina">Águia Divina</option>
            <option value="aguia-da-paz">Águia da Paz</option>
            <option value="aguia-prateada">Águia Prateada</option>
        </optgroup>
        <optgroup label="Ala Masculina">
            <option value="falcao">Falcão</option>
            <option value="condor">Condor</option>
        </optgroup>
    </select>
</div>

<div id="lista-membros-firebase" class="grid-membros">
    </div>

<script type="module" src="gestao.js"></script>
